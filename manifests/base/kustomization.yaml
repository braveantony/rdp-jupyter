# Base: Namespace, Deployment and NodePort Service (30391). /home and
# /opt/jupyter/extra are not mounted here; pick an overlay: ../stateless
# (emptyDir) or ../stateful (PVC). The login accounts come from a Secret named
# rdp-jupyter-users (key: users), generated by the overlay's secretGenerator.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rdp-jupyter
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
