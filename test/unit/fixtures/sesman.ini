# xrdp-sesman configuration: a fragment of Debian's xrdp 0.10.1 /etc/xrdp/sesman.ini
# with the [Globals], [Security] and [Sessions] sections kept as they ship.

[Globals]
; ListenAddress - the address sesman listens on; xrdp connects here
ListenAddress=127.0.0.1
; ListenPort - the port sesman listens on
ListenPort=3350
; EnableUserWindowManager - let users pick their own window manager
EnableUserWindowManager=1
; UserWindowManager - the script run when the user has a window manager of their own
UserWindowManager=startwm.sh
; DefaultWindowManager - the script run otherwise
DefaultWindowManager=startwm.sh
; ReconnectScript - the script run when a session reconnects
ReconnectScript=reconnectwm.sh

[Security]
; AllowRootLogin - allow root to log in over RDP
AllowRootLogin=true
; MaxLoginRetry - login attempts allowed before the connection is closed
MaxLoginRetry=4
; TerminalServerUsers - if set, only members of this group may log in
TerminalServerUsers=tsusers
; TerminalServerAdmins - members of this group may log in even if not in the users group
TerminalServerAdmins=tsadmins

[Sessions]
; X11DisplayOffset - the first X display number used for sessions
X11DisplayOffset=10
; MaxSessions - the maximum number of sessions
MaxSessions=50
; KillDisconnected - kill a session when it is disconnected
KillDisconnected=false
; IdleTimeLimit - kill a session idle for this many seconds (0 means never)
IdleTimeLimit=0
; DisconnectedTimeLimit - kill a disconnected session after this many seconds (0 means never)
DisconnectedTimeLimit=0
; Policy - how a connection is matched to a session
;Policy=UBDI
Policy=Separate
